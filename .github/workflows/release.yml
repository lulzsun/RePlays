name: Create Release

# Run manually from the Actions tab with the version to release. The release is
# built from the commit the workflow is run on and tagged with that version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release as MAJOR.MINOR.PATCH (for example 1.4.0)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft so the notes can be reviewed before publishing"
        required: false
        type: boolean
        default: true

jobs:
  prep:
    runs-on: ubuntu-latest
    name: Validate version

    outputs:
      version: ${{ steps.validate.outputs.version }}
      previous: ${{ steps.validate.outputs.previous }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: "Validate the requested version"
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a MAJOR.MINOR.PATCH version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::A tag named $version already exists"
            exit 1
          fi
          latest=$(git tag --list '[0-9]*' | sort -V | tail -n 1)
          if [[ -n "$latest" && "$(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "::error::$version is not higher than the latest release $latest"
            exit 1
          fi
          echo "Releasing version $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "previous=$latest" >> $GITHUB_OUTPUT

  build:
    needs: prep
    runs-on: windows-2022
    name: Build RePlays

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.403

      # vpk (velopack) is pinned in .config/dotnet-tools.json and run by the publish
      - name: Restore dotnet tools
        run: dotnet tool restore

      # the previous stable full package is what the delta package is built against.
      # the current stable (1.3.0) is still a squirrel release, so until the first
      # velopack stable exists this has nothing to fetch and the build goes on
      # without a delta rather than failing (same as the nightly workflow)
      - name: Download previous release to create delta
        continue-on-error: true
        run: dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir bin/Deployment/Releases

      # libobs is built once per version of build-libobs.cmd and kept on the
      # "libobs" release, so this normally only downloads it (see libobs.yml)
      - name: Get LibObs
        uses: ./.github/actions/libobs
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RePlays
        env:
          CI: false
        run: dotnet publish /p:Configuration=Release /p:Version=${{needs.prep.outputs.version}} /p:PublishProfile=FolderProfile -v d

      # the setup executable keeps its plain name so the README download badge
      # and "releases/latest" links keep working
      - name: Rename setup file
        run: ren ./bin/Deployment/Releases/RePlays-win-Setup.exe RePlaysSetup.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.prep.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ format('RePlays v{0}', needs.prep.outputs.version) }}
          draft: ${{ inputs.draft }}
          prerelease: false
          # the notes are written by the step below
          generate_release_notes: false
          files: |
            ./bin/Deployment/Releases/RELEASES
            ./bin/Deployment/Releases/releases.win.json
            ./bin/Deployment/Releases/RePlaysSetup.exe
            ./bin/Deployment/Releases/RePlays-${{needs.prep.outputs.version}}-full.nupkg
            ./bin/Deployment/Releases/RePlays-${{needs.prep.outputs.version}}-delta.nupkg

      # the notes list everything since the previous stable release. the previous tag
      # is given explicitly because, left to pick it, GitHub takes whichever tag it
      # considers the previous release, and the nightly and libobs tags are candidates.
      # target_commitish only matters for a draft, whose tag does not exist yet
      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prep.outputs.version }}
          PREVIOUS: ${{ needs.prep.outputs.previous }}
        run: |
          args=(-f "tag_name=$VERSION" -f "target_commitish=$GITHUB_SHA")
          if [[ -n "$PREVIOUS" ]]; then args+=(-f "previous_tag_name=$PREVIOUS"); fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > notes.md
          gh release edit "$VERSION" --notes-file notes.md
